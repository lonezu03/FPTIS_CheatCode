services:
  - type: web
    name: fittrack-backend
    runtime: docker
    rootDir: Project/fittrack_ai/backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 900000
      - key: JWT_REFRESH_EXPIRATION_DAYS
        value: 30
      - key: ADMIN_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ASSISTANT_REQUESTS_PER_MINUTE
        value: 6
      - key: KEEP_ALIVE_ENABLED
        value: false
      - key: KEEP_ALIVE_INTERVAL_MS
        value: 600000
      - key: INTERNAL_SCHEDULER_ENABLED
        value: false
      - key: JOB_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_FRONTEND_URL
        value: https://datcom-nhalam.vercel.app
      - key: MAIL_ENABLED
        sync: false
      - key: REGISTRATION_REQUIRES_EMAIL
        value: true
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: JPA_DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: true
      - key: SWAGGER_ENABLED
        value: false
      - key: JPA_SHOW_SQL
        value: false
      - key: DB_POOL_MAX_SIZE
        value: 5
      - key: OTEL_EXPORT_ENABLED
        value: false
      - key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        sync: false
      - key: MEDIA_PROVIDER
        value: cloudinary
      - key: MEDIA_ALLOWED_HOSTS
        value: res.cloudinary.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
