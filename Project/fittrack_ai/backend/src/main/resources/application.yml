server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  application:
    name: fittrack-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fittrack_db}
    username: ${SPRING_DATASOURCE_USERNAME:fittrack_user}
    password: ${SPRING_DATASOURCE_PASSWORD:fittrack_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://fptis-cheat-code.vercel.app,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:fittrack_super_secret_key_fittrack_super_secret_key_2026}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}

  assistant:
    requests-per-minute: ${ASSISTANT_REQUESTS_PER_MINUTE:6}

  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

  keep-alive:
    enabled: ${KEEP_ALIVE_ENABLED:false}
    url: ${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
    interval-ms: ${KEEP_ALIVE_INTERVAL_MS:600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
