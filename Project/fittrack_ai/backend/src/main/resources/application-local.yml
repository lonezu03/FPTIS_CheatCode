spring:
  datasource:
    url: jdbc:h2:file:./data/fittrack_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  # Keep the documented demo account convenient only in the local profile.
  admin-emails: ${ADMIN_EMAILS:admin@fittrack.local,test@gmail.com}
