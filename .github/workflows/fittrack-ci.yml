name: FitTrack CI

on:
  push:
    paths:
      - "Project/fittrack_ai/**"
      - ".github/workflows/fittrack-ci.yml"
  pull_request:
    paths:
      - "Project/fittrack_ai/**"
      - ".github/workflows/fittrack-ci.yml"

concurrency:
  group: fittrack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/fittrack_ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - name: Unit, integration and PostgreSQL migration tests
        run: ./mvnw --batch-mode verify
      - name: Build backend Docker image
        run: docker build --tag fittrack-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/fittrack_ai/frontend/fittrack-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: Project/fittrack_ai/frontend/fittrack-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: /api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
